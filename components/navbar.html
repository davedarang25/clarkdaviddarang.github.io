<!--
  navbar.html — Sticky Glass Command Bar
  This snippet is inlined directly into index.html's <header>.
  Kept here as a standalone reference/component file per the requested structure.
-->
<header class="sticky top-0 z-50 glass-panel border-b" style="border-color: var(--glass-border);">
  <div class="max-w-6xl mx-auto px-5 md:px-8 h-16 flex items-center justify-between">

    <a href="#top" class="flex items-center gap-2.5 shrink-0">
      <span class="w-8 h-8 rounded-sm flex items-center justify-center"
            style="background: var(--badge-bg); border: 1px solid var(--glass-border-strong);">
        <i data-lucide="radar" class="w-4 h-4" style="color: var(--accent-crimson-bright);"></i>
      </span>
      <span class="font-semibold tracking-tight text-sm md:text-base">
        <span data-field="fullName">Operative</span>
        <span class="opacity-40 mx-1">/</span>
        <span class="font-mono-hud text-xs opacity-60" data-field="codename">—</span>
      </span>
    </a>

    <nav class="hidden md:flex items-center gap-7">
      <a href="#briefing" class="nav-link">Intel Briefing</a>
      <a href="#deployments" class="nav-link">Deployments</a>
      <a href="#projects" class="nav-link">Projects</a>
      <a href="#clearance" class="nav-link">Clearance</a>
      <a href="#comm" class="nav-link">Comm</a>
    </nav>

    <div class="flex items-center gap-3">
      <span class="status-pill hidden sm:inline-flex">
        <span class="pulse-dot"></span>
        <span data-field="status">ONLINE</span>
      </span>

      <button data-theme-toggle type="button"
              class="w-9 h-9 rounded-sm flex items-center justify-center glass-panel hover:opacity-80 transition-opacity"
              aria-label="Toggle Coruscant Command / Venator Bridge mode">
        <i data-theme-icon data-lucide="moon" class="w-4 h-4"></i>
      </button>

      <button id="nav-toggle" type="button"
              class="md:hidden w-9 h-9 rounded-sm flex items-center justify-center glass-panel"
              aria-label="Open navigation menu">
        <i data-lucide="menu" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="hidden md:hidden glass-panel border-t px-5 py-4 flex flex-col gap-4"
       style="border-color: var(--glass-border);">
    <a href="#briefing" class="nav-link">Intel Briefing</a>
    <a href="#deployments" class="nav-link">Deployments</a>
    <a href="#projects" class="nav-link">Projects</a>
    <a href="#clearance" class="nav-link">Clearance</a>
    <a href="#comm" class="nav-link">Comm</a>
  </div>
</header>
