<!--
  footer.html — Galactic Republic Footbar
  This snippet is inlined directly into index.html's <footer>.
  Kept here as a standalone reference/component file per the requested structure.
-->
<footer class="border-t mt-10" style="border-color: var(--glass-border);">
  <div class="max-w-6xl mx-auto px-5 md:px-8 py-8 flex flex-col md:flex-row items-center justify-between gap-4">

    <div class="flex items-center gap-2 text-xs opacity-60 font-mono-hud">
      <i data-lucide="shield" class="w-3.5 h-3.5"></i>
      <span>GALACTIC REPUBLIC ARCHIVES &copy; <span id="boot-year">2026</span></span>
      <span class="opacity-40">/</span>
      <span data-field="fullName">Operative</span>
    </div>

    <div class="icon-button-group">
          <!-- GitHub Button -->
          <a href="https://github.com/YOUR_GITHUB_USERNAME" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>

          <!-- LinkedIn Button -->
          <a href="https://linkedin.com/in/YOUR_LINKEDIN_USERNAME" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>

          <!-- Email / Contact Button -->
          <a href="mailto:your.email@example.com" class="icon-btn" aria-label="Email">
            <i class="far fa-envelope"></i>
          </a>
        </div>
      <span class="text-[11px] font-mono-hud opacity-40" data-clock>--:--:--</span>
    </div>
  </div>
</footer>
